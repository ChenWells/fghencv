    // =========================================================================
    // 頂部即時到訪人數條 (TopBar Component)
    // 支援：骨架屏、Session 防重複、Page Visibility 休眠暫停、即時連動
    // =========================================================================
    function TopBar() {
      const [visitCount, setVisitCount] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [isUpdated, setIsUpdated] = useState(false);

      useEffect(() => {
        let isMounted = true;
        let pollTimer = null;

        const fetchCount = async (isInitial = false) => {
          // 檢查 Session：若同一分頁首次造訪則 increment，重新整理則 get_only
          const hasVisitedThisSession = sessionStorage.getItem("cv_visited_session");
          const action = (isInitial && !hasVisitedThisSession) ? "increment" : "get_only";

          if (isInitial && !hasVisitedThisSession) {
            sessionStorage.setItem("cv_visited_session", "true");
          }

          if (GAS_WEB_APP_URL && GAS_WEB_APP_URL.trim() !== "") {
            try {
              const res = await fetch(`${GAS_WEB_APP_URL}?action=${action}`);
              const data = await res.json();
              if (data && data.visits && isMounted) {
                setVisitCount(prev => {
                  if (prev !== null && prev !== data.visits) {
                    setIsUpdated(true);
                    setTimeout(() => setIsUpdated(false), 1500);
                  }
                  return data.visits;
                });
                setIsLoading(false);
              }
            } catch (err) {
              console.warn("GAS fetch error, using local fallback:", err);
              fallbackLocal();
            }
          } else {
            // 本地未設定 GAS 時的友善模擬展示
            fallbackLocal();
          }
        };

        const fallbackLocal = () => {
          const cached = localStorage.getItem("cv_mock_visits") || 1358;
          let newCount = Number(cached);
          const hasVisitedThisSession = sessionStorage.getItem("cv_visited_session");
          if (!hasVisitedThisSession) {
            newCount += 1;
            sessionStorage.setItem("cv_visited_session", "true");
            localStorage.setItem("cv_mock_visits", newCount);
          }
          if (isMounted) {
            setVisitCount(newCount);
            setIsLoading(false);
          }
        };

        // 初始抓取
        fetchCount(true);

        // 定時輪詢 (每 30 秒) + Page Visibility API 節省資源
        const startPolling = () => {
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(() => {
            if (document.visibilityState === "visible") {
              fetchCount(false);
            }
          }, 30000);
        };

        const handleVisibilityChange = () => {
          if (document.visibilityState === "visible") {
            fetchCount(false);
            startPolling();
          } else {
            if (pollTimer) clearInterval(pollTimer);
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);
        startPolling();

        return () => {
          isMounted = false;
          if (pollTimer) clearInterval(pollTimer);
          document.removeEventListener("visibilitychange", handleVisibilityChange);
        };
      }, []);

      return (
        <div className="bg-primary-dark text-white text-xs py-2 px-4 border-b border-primary/40 no-print transition-all">
          <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2.5">
              <span className="relative flex h-2.5 w-2.5">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
              </span>
              <span className="text-slate-200 font-medium tracking-wide">

    // =========================================================================
    // 預約與洽詢彈跳表單 (Modal Component)
    // 支援：蜜罐防機器人、Google Apps Script POST 傳送、成功/失敗 Toast
    // =========================================================================
    function ContactModal({ isOpen, onClose, onShowToast }) {
      // 測試資料常數：用於驗證 Google Sheet 寫入與 Gmail 自動通知
      const TEST_DATA = {
        name: "王大明 研發經理 (測試)",
        organization: "全端科技創新股份有限公司",
        email: "fgchen.test@gmail.com",
        phone: "0912-345-678",
        type: "演講邀約",
        message: "【系統連線測試】這是一筆用於驗證 Google Sheet 與 GAS 後端連線的測試資料。預計邀約陳富國博士於 2026 年度進行智慧科技與物聯網創新應用之專題演講，聆聽人數約 80 人。",
        hp_website: "" // 蜜罐隱藏欄位保持為空
      };

      const [formData, setFormData] = useState(TEST_DATA);
      const [submitting, setSubmitting] = useState(false);

      // 開啟時鎖定滾動，關閉時解除；支援 ESC 鍵關閉
      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = "hidden";
          const handleKeyDown = (e) => {
            if (e.key === "Escape") onClose();
          };
          window.addEventListener("keydown", handleKeyDown);
          return () => {
            document.body.style.overflow = "unset";
            window.removeEventListener("keydown", handleKeyDown);
          };
        } else {
          document.body.style.overflow = "unset";
        }
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleClear = () => {
        setFormData({
          name: "", organization: "", email: "", phone: "", type: "演講邀約", message: "", hp_website: ""
        });
      };

      const handleFillTest = () => {
        setFormData(TEST_DATA);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);

        // 蜜罐檢查：若隱藏欄位被填入，靜默模擬成功
        if (formData.hp_website && formData.hp_website.trim() !== "") {
          setTimeout(() => {
            setSubmitting(false);
            onClose();
            onShowToast("success", "洽詢訊息已送出，陳博士將儘速與您聯繫！");
          }, 800);
          return;
        }

        if (GAS_WEB_APP_URL && GAS_WEB_APP_URL.trim() !== "") {
          try {
            await fetch(GAS_WEB_APP_URL, {
              method: "POST",
              mode: "no-cors", // 相容 GAS 跨域重定向
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(formData)
            });
            setSubmitting(false);
            onClose();
            onShowToast("success", "預約洽詢已成功送出！資料已寫入 Google 試算表並發送通知信。");
          } catch (err) {
            console.error("Submission failed:", err);
            setSubmitting(false);
            onShowToast("error", "送出失敗，請檢查 GAS 部署權限或稍後再試。");
          }
        } else {
          // 本地開發/尚未綁定 GAS 時之友善模擬
          setTimeout(() => {
            console.log("Local Mock Submit Data:", formData);
            setSubmitting(false);
            onClose();
            onShowToast("success", "【模擬送出成功】表單資料已驗證，實際部署時將直接寫入 Google 試算表並發送 Gmail 通知！");
          }, 1000);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          {/* 背景點擊遮罩 */}
          <div className="absolute inset-0" onClick={onClose}></div>

          {/* 表單內容面板 */}
          <div className="relative bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[92vh] overflow-y-auto border border-slate-100 z-10 animate-scaleUp">
            {/* 標題欄 */}
            <div className="bg-primary text-white p-5 rounded-t-2xl flex items-center justify-between">
              <div>
                <h3 className="font-bold text-lg flex items-center gap-2">
                  <i className="fa-solid fa-paper-plane text-accent"></i>
                  <span>預約演講 / 合作洽詢</span>
                </h3>
                <p className="text-xs text-surface/80 mt-0.5">
                  表單將即時同步至 Google 試算表並發送通知信
                </p>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors"
                aria-label="關閉"
              >
                <i className="fa-solid fa-xmark text-sm"></i>
              </button>
            </div>

            {/* 表單主體 */}
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              
              {/* 測試輔助提示列 */}
              <div className="bg-amber-50/90 border border-amber-200 rounded-xl px-3 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
                <span className="text-amber-800 font-medium flex items-center gap-1.5">
                  <i className="fa-solid fa-vial-circle-check text-amber-600"></i>
                  <span>所有欄位已預填測試資料，可直接點擊送出</span>
                </span>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleFillTest}
                    className="text-[11px] font-bold text-primary hover:text-secondary underline"
                  >
                    重填測試資料
                  </button>
                  <span className="text-amber-300">|</span>
                  <button
                    type="button"
                    onClick={handleClear}
                    className="text-[11px] text-slate-500 hover:text-slate-700 underline"
                  >
                    清空
                  </button>
                </div>
              </div>

              {/* 蜜罐隱藏欄位 (Anti-Spam) */}
              <input
                type="text"
                name="hp_website"
                value={formData.hp_website}
                onChange={handleChange}
                style={{ display: "none" }}
                tabIndex="-1"
                autoComplete="off"
              />

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    您的姓名 / 稱謂 <span className="text-accent">*</span>
                  </label>
                  <input
                    type="text"
                    name="name"
                    required
                    value={formData.name}
                    onChange={handleChange}
                    placeholder="例：王小明 經理"
                    className="w-full text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    所屬單位 / 學校 / 機構 <span className="text-accent">*</span>
                  </label>
                  <input
                    type="text"
                    name="organization"
                    required
                    value={formData.organization}
                    onChange={handleChange}
                    placeholder="例：XX科技大學 / XX公司"
                    className="w-full text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    電子郵件 Email <span className="text-accent">*</span>
                  </label>
                  <input
                    type="email"
                    name="email"
                    required
                    value={formData.email}
                    onChange={handleChange}
                    placeholder="name@example.com"
                    className="w-full text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    聯絡電話 / LINE ID (選填)
                  </label>
                  <input
                    type="text"
                    name="phone"
                    value={formData.phone}
                    onChange={handleChange}
                    placeholder="0912-345-678"
                    className="w-full text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  洽詢項目類型 <span className="text-accent">*</span>
                </label>
                <select
                  name="type"
                  value={formData.type}
                  onChange={handleChange}
                  className="w-full text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary bg-white"
                >
                  <option value="演講邀約">專題演講邀約 (物聯網 / AI / Web創新)</option>
                  <option value="課程教學與內訓">大專院校授課 / 企業內部培訓</option>
                  <option value="產學合作研發">產學合作計畫 / 專案委託研發</option>
                  <option value="技術顧問諮詢">技術架構顧問 / 系統健檢諮詢</option>
                  <option value="學生專題與升學">學生專題指導 / 升學諮詢</option>
                  <option value="其他合作交流">其他學術或商務交流</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  洽詢主題與需求說明 <span className="text-accent">*</span>
                </label>
                <textarea
                  name="message"
                  required
                  rows="4"
                  value={formData.message}
                  onChange={handleChange}
                  placeholder="請簡述預計時間、演講題目、對象人數或合作專案內容細節..."

                ></textarea>
              </div>

              <div className="pt-2 flex items-center justify-end gap-3">
                <button

                  取消
                </button>
                <button
                  type="submit"
                  disabled={submitting}
                  className="bg-accent hover:bg-accent-hover text-white font-bold px-6 py-2.5 rounded-lg text-xs sm:text-sm shadow-md shadow-accent/30 transition-all flex items-center gap-2 disabled:opacity-50"

                  {submitting ? (
                    <>
                      <i className="fa-solid fa-spinner animate-spin"></i>

    function Toast({ toast, onClose }) {
      if (!toast) return null;

      const isSuccess = toast.type === "success";

      return (
        <div className="fixed bottom-6 right-6 z-50 max-w-md bg-white rounded-xl shadow-2xl border border-slate-200 p-4 animate-slideUp flex items-start gap-3">
          <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-white ${
            isSuccess ? 'bg-emerald-500' : 'bg-rose-500'
          }`}>
            <i className={`fa-solid ${isSuccess ? 'fa-check' : 'fa-triangle-exclamation'}`}></i>
          </div>
          <div className="flex-1">
            <div className={`text-sm font-bold ${isSuccess ? 'text-emerald-800' : 'text-rose-800'}`}>
              {isSuccess ? '送出成功' : '注意'}
            </div>
            <div className="text-xs text-slate-600 mt-0.5 leading-relaxed">
              {toast.message}
            </div>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
            <i className="fa-solid fa-xmark text-xs"></i>
          </button>
        </div>
      );
    }

    // 手機端懸浮快速洽詢按鈕 (FAB Component)
    // =========================================================================
    function MobileFAB({ onOpenModal }) {
      return (
        <div className="fixed bottom-6 right-6 z-30 sm:hidden no-print">
          <button
            onClick={onOpenModal}
            className="w-14 h-14 rounded-full bg-accent hover:bg-accent-hover text-white shadow-2xl shadow-accent/50 flex items-center justify-center text-xl transition-transform active:scale-90"
            aria-label="快速預約演講或合作"
          >
            <i className="fa-solid fa-comment-dots"></i>
          </button>
        </div>
      );
    }

    // =========================================================================
    // 根元件 (Main App Component)
    // =========================================================================
    function App() {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (type, message) => {
        setToast({ type, message });
        setTimeout(() => setToast(null), 5000);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* 1. 開頭第一列：即時到訪人數條 */}
          <TopBar />

          {/* 2. 導覽列 */}
          <Navbar onOpenModal={() => setIsModalOpen(true)} />

          {/* 3. 首頁主視覺 Hero */}
          <Hero onOpenModal={() => setIsModalOpen(true)} />

          {/* 4. 經歷時間軸 */}
          <ExperienceTimeline />

          {/* 5. 精選研究專案 */}
          <Projects onOpenModal={() => setIsModalOpen(true)} />

          {/* 6. 專業核心技能 */}
          <Skills />

          {/* 7. 25+ 專業證照 */}
          <Certificates />

          {/* 8. 學術背景 */}
          <Education />

          {/* 9. 聯絡方式與頁尾 */}
          <Footer onOpenModal={() => setIsModalOpen(true)} />

          {/* 互動彈跳 Modal 表單 */}
          <ContactModal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            onShowToast={showToast}
          />

          {/* 提示訊息 Toast */}
          <Toast toast={toast} onClose={() => setToast(null)} />

          {/* 手機版 FAB 浮動按鈕 */}
          <MobileFAB onOpenModal={() => setIsModalOpen(true)} />
        </div>
      );
    }

    // 掛載渲染至 Root
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
